<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recall — Chat preview</title>

    <link rel="stylesheet" href="{{ url_for('static', path='/css/output.css') }}">
</head>
<body class="min-h-screen bg-[#f4f7f4] px-4 py-8 text-[#17211b] sm:px-6">
    <main class="mx-auto flex w-full max-w-3xl flex-col gap-6">
        <header>
            <p class="text-xs font-semibold uppercase tracking-[0.18em] text-[#16856b]">Recall</p>
            <h1 class="mt-1 text-2xl font-semibold tracking-tight">Chat preview</h1>
            <p class="mt-1 text-sm text-[#68766e]">Upload an exported chat to read it here.</p>
        </header>

        <section class="rounded-2xl border border-[#dce7df] bg-white p-4 shadow-sm sm:p-5" aria-label="Upload chat">
            <form id="upload-form" class="flex flex-col gap-3 sm:flex-row sm:items-center">
                <input name="file" type="file" id="file-input" class="min-w-0 flex-1 rounded-lg border border-[#dce7df] bg-white px-3 py-2 text-sm text-[#526158] file:mr-3 file:rounded-md file:border-0 file:bg-[#e8f5ed] file:px-3 file:py-1.5 file:font-medium file:text-[#147a55]">
                <button type="submit" class="rounded-lg bg-[#16856b] px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-[#116d57] focus:outline-none focus:ring-2 focus:ring-[#16856b] focus:ring-offset-2" id="upload-btn">Upload chat</button>
            </form>
            <p id="status" class="mt-3 text-sm text-[#68766e]" role="status" aria-live="polite"></p>
        </section>

        <section class="overflow-hidden rounded-2xl border border-[#dce7df] bg-[#efe9df] shadow-sm" aria-label="Uploaded chat messages">
            <div class="border-b border-[#dce7df] bg-white px-5 py-4">
                <h2 class="text-sm font-semibold text-[#263a30]" id="chat-profile">Messages</h2>
            </div>
            <div id="chat-messages" class="flex max-h-[70vh] min-h-72 flex-col gap-3 overflow-y-auto bg-[#efe9df] p-4 sm:p-6" aria-live="polite" aria-relevant="additions text">
                <p id="chat-empty" class="m-auto max-w-xs text-center text-sm leading-6 text-[#78867d]">Your uploaded chat will appear here.</p>
            </div>
        </section>

        <div id="uploaded-documents"></div>
    </main>
    <script src="{{ url_for('static', path='/js/main.js') }}"></script>
</body>
</html>
